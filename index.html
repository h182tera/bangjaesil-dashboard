<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>열교환기 모니터링 시스템 v1.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#050d1a; --bg2:#081426; --panel:#0a1c35; --panel2:#0d2244;
    --border:#1a3a5c; --accent:#00c8ff; --accent2:#0088cc;
    --text:#cce8ff; --text2:#7aadcc; --text3:#3a6a8a;
    --glow:0 0 20px rgba(0,200,255,.3);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;min-height:100vh;overflow-x:hidden;}

  header{position:relative;z-index:10;background:linear-gradient(180deg,#020a14,var(--bg2));border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;}
  .hdr-l{display:flex;align-items:center;gap:16px;}
  .logo{width:40px;height:40px;background:linear-gradient(135deg,#5c2a00,#cc6600);border:1px solid #ff9a3c;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 20px rgba(255,140,40,.3);}
  .hdr-title{font-size:18px;font-weight:700;color:var(--accent);letter-spacing:1px;text-shadow:var(--glow);}
  #clock{font-weight:500;font-size:13px;color:var(--accent);background:rgba(0,200,255,.08);border:1px solid var(--border);border-radius:6px;padding:6px 14px;}

  .tab-nav{position:relative;z-index:10;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;padding:0 24px;gap:4px;}
  .tab-btn{padding:12px 20px;font-size:13px;font-weight:500;color:var(--text3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .2s;}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);text-shadow:0 0 10px rgba(0,200,255,.5);}

  .main{position:relative;z-index:1;padding:20px 24px;max-width:1400px;margin:0 auto;}

  .upload-bar{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .up-area{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .file-btn{padding:7px 16px;background:linear-gradient(135deg,#003a5c,#0066aa);border:1px solid var(--accent2);border-radius:6px;color:var(--text);font-size:12px;cursor:pointer;transition:all .2s;white-space:nowrap;}
  .file-btn:hover{background:linear-gradient(135deg,#004a6c,#0088cc);box-shadow:var(--glow);}
  .file-btn:disabled{opacity:.35;cursor:default;box-shadow:none;}

  .mode-toggle{display:flex;background:var(--bg2);border-radius:20px;padding:2px;border:1px solid var(--border);}
  .m-btn{width:60px;padding:5px 0;border-radius:18px;font-size:11px;border:none;background:none;color:var(--text3);cursor:pointer;transition:all .2s;text-align:center;}
  .m-btn.active{background:var(--accent);color:var(--bg);font-weight:700;}

  .date-nav{display:flex;align-items:center;gap:12px;}
  #date-disp{font-size:14px;font-weight:700;color:var(--text);min-width:90px;text-align:center;}

  .cpanel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;}
  .cpanel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .cpanel-title{font-size:15px;color:var(--text);font-weight:700;text-shadow:var(--glow);}

  .cwrap{position:relative;height:550px;}
  .cwrap-full{position:relative;height:480px;}

  .legend-bar{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;}
  .leg-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer;user-select:none;transition:opacity .2s;}
  .leg-item:hover{color:var(--text);}
  .leg-dot{width:12px;height:12px;border-radius:3px;}
  .leg-dot.dark{width:8px;height:8px;border-radius:50%;opacity:.8;}

  .tbl-ctrls{display:flex;gap:8px;flex-wrap:wrap;}
  .tbl-btn{padding:8px 18px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--text2);transition:all .15s;}
  .tbl-btn.active{background:rgba(0,200,255,.15);border-color:var(--accent);color:var(--accent);}

  .tbl-wrap{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;}
  thead th{background:var(--panel2);padding:8px 4px;font-size:11px;color:var(--text);border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody td{padding:6px 4px;text-align:center;font-size:12px;border-bottom:1px solid rgba(26,58,92,.5);}
  tbody tr:hover{background:rgba(0,200,255,.05);}

  .tab-view{display:none;}
  .tab-view.active{display:block;}
  .empty-msg{padding:60px 0;text-align:center;color:var(--text2);font-size:14px;line-height:1.8;}
  footer{text-align:center;padding:16px;font-size:11px;color:var(--text3);border-top:1px solid var(--border);margin-top:20px;}

  .loading-area{display:none;align-items:center;gap:6px;color:var(--accent);font-size:11px;font-weight:700;}
  .loading-area.show{display:flex;}
  .spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media(max-width:700px){
    header{padding:0 12px;height:60px;}
    .main{padding:12px;}
    .tab-nav{overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;padding:0 12px;}
    .tab-btn{padding:14px 16px;font-size:13px;}
    .upload-bar{flex-direction:column;align-items:stretch;gap:12px;padding:14px;}
    .up-area{justify-content:space-between;width:100%;}
    .date-nav{justify-content:space-between;width:100%;margin-top:4px;}
    .cwrap,.cwrap-full{height:320px;}
  }
</style>
</head>
<body>

<header>
  <div class="hdr-l">
    <div class="logo">🌡️</div>
    <div>
      <div class="hdr-title">열교환기 모니터링</div>
      <div style="font-size:11px;color:var(--text2);">현대 테라타워 향동 방재실</div>
    </div>
  </div>
  <div id="clock">--</div>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('overview',this)">📊 통합 현황</button>
  <button class="tab-btn" onclick="switchTab('table',this)">📋 데이터표</button>
</nav>

<div class="main">
  <div class="upload-bar">
    <div class="up-area">
      <div class="mode-toggle">
        <button class="m-btn active" id="mode-daily" onclick="setMode('daily')">일간</button>
        <button class="m-btn" id="mode-3days" onclick="setMode('3days')">3일간</button>
      </div>
      <div class="loading-area" id="loading-area"><div class="spinner"></div>수신중...</div>
    </div>
    <div class="date-nav">
      <button onclick="changeDate(-1)" class="file-btn" style="padding:6px 12px;" id="prev-btn" disabled>◀</button>
      <span id="date-disp">대기중</span>
      <button onclick="changeDate(1)" class="file-btn" style="padding:6px 12px;" id="next-btn" disabled>▶</button>
    </div>
  </div>

  <div class="tab-view active" id="tab-overview">
    <div id="top-section"></div>
    <div id="bottom-section" style="margin-top:24px;"></div>
  </div>

  <div class="tab-view" id="tab-table">
    <div class="cpanel"><div id="table-content"></div></div>
  </div>
</div>

<footer>현대 테라타워 향동 방재실 · 열교환기 대시보드 v1.0</footer>

<script>
// 열교환기 일보 반환용 Apps Script 웹앱 (열교환기리포트 폴더의 최신 7개 파일)
const GAS_URL = "https://script.google.com/macros/s/AKfycbzO8mF1hivkXOxsDUy6t0v4VeFhmu137EWRzrPTN5yMxNitLYoEne95aoi4YNjCHxap/exec";

// 일보 XLS 구조: 기기 4대 × 8열 (장비 순서: 근생, 업무(=오피스텔), 지산고, 지산저)
const DEVS   = ['근생','오피스텔','지산고','지산저'];
const FIELDS = ['중온수공급','중온수환수','난방공급','난방환수','난방공급압력','난방환수압력','급탕공급','급탕환수'];

// 통합 비교 탭 설정 (항목 추가 시 여기에 한 줄만 추가)
const TYPES = {
  jung: { name:'중온수',   f:['중온수공급','중온수환수'],       unit:'°C'  },
  nan:  { name:'난방',     f:['난방공급','난방환수'],           unit:'°C'  },
  geup: { name:'급탕',     f:['급탕공급','급탕환수'],           unit:'°C'  },
  pres: { name:'난방압력', f:['난방공급압력','난방환수압력'],   unit:'kgf' }
};

const C4      = ['#00e5ff','#39ff6b','#ffcc00','#ff5fa0'];
const C4_DARK = ['#008291','#229940','#997a00','#993960'];

let allData = {}, curDate = null, sorted = [], charts = {};
let currentType = 'jung';
let currentDev = '오피스텔';
let currentTableDev = '오피스텔';
let viewMode = 'daily';

function tick(){
  const n=new Date(), p=v=>String(v).padStart(2,'0');
  document.getElementById('clock').textContent=`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())} ${p(n.getHours())}:${p(n.getMinutes())}`;
}
tick(); setInterval(tick,30000);

function setMode(mode){
  viewMode = mode;
  document.getElementById('mode-daily').classList.toggle('active', mode==='daily');
  document.getElementById('mode-3days').classList.toggle('active', mode==='3days');
  renderAll();
}

/* ── 데이터 읽기 ── */
const num = v => (typeof v==='number' && isFinite(v)) ? v : null;

function hourLabel(v){
  if(typeof v==='number'){
    const h = Math.round((v - Math.floor(v)) * 24) % 24;   // 1.0 → 00:00, 1.0417 → 01:00
    return String(h).padStart(2,'0') + ':00';
  }
  const m = String(v).match(/(\d{1,2}):(\d{2})/);
  return m ? String(+m[1] % 24).padStart(2,'0') + ':' + m[2] : null;
}

function parseReport(f){
  const wb = XLSX.read(atob(f.data), {type:'binary'});
  const ws = wb.Sheets['Sheet1'] || wb.Sheets[wb.SheetNames[0]];
  if(!ws) return null;
  const raw = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});

  // 날짜: 파일명(YY-MM-DD) 우선, 없으면 일보 안의 날짜 셀
  const fm = f.name.match(/\d{2}-\d{2}-\d{2}/);
  let ds = fm ? `20${fm[0]}` : null;
  if(!ds && raw[2] && typeof raw[2][1]==='number') ds = new Date(Math.round((raw[2][1]-25569)*86400000)).toISOString().slice(0,10);
  if(!ds) return null;

  // 데이터 시작 행: '시간' 머리글 다음 줄 (못 찾으면 8번째 줄)
  let start = raw.findIndex(r => r && String(r[0]).replace(/\s/g,'') === '시간');
  start = start >= 0 ? start + 1 : 7;

  const hours = [], cd = {};
  DEVS.forEach(d => { cd[d] = {}; FIELDS.forEach(k => cd[d][k] = []); });
  let hasValue = false;

  for(let i=start; i<raw.length; i++){
    const row = raw[i]; if(!row || row[0]==null) continue;
    const t = String(row[0]);
    if(t.includes('최대') || t.includes('최소') || t.includes('평균')) continue;
    const h = hourLabel(row[0]); if(!h) continue;
    hours.push(h);
    DEVS.forEach((d, di) => FIELDS.forEach((k, ki) => {
      const v = num(row[1 + di*8 + ki]);
      if(v !== null) hasValue = true;
      cd[d][k].push(v);
    }));
  }
  return hasValue ? {ds, hours, chillers: cd} : null;
}

async function loadDriveData(){
  document.getElementById('loading-area').classList.add('show');
  try {
    const response = await fetch(GAS_URL);
    const files = await response.json();
    allData = {};
    for(const f of files){
      try { const r = parseReport(f); if(r) allData[r.ds] = {hours:r.hours, chillers:r.chillers}; }
      catch(e){ console.error('파일 읽기 실패:', f.name, e); }
    }
    sorted = Object.keys(allData).sort();
    if(sorted.length > 0){
      curDate = sorted[sorted.length-1];
      renderAll();
    } else {
      showEmpty('열교환기리포트 폴더에 읽을 수 있는 일보가 없습니다.');
    }
  } catch(error){
    console.error(error);
    showEmpty('데이터를 불러오지 못했습니다.<br>인터넷 연결을 확인하고 화면을 새로고침(F5) 해 주세요.');
  } finally {
    document.getElementById('loading-area').classList.remove('show');
  }
}

function showEmpty(msg){
  curDate = null; sorted = [];
  Object.values(charts).forEach(c => c && c.destroy()); charts = {};
  document.getElementById('date-disp').textContent = '데이터 없음';
  document.getElementById('prev-btn').disabled = true;
  document.getElementById('next-btn').disabled = true;
  const html = `<div class="cpanel"><div class="empty-msg">${msg}</div></div>`;
  document.getElementById('top-section').innerHTML = html;
  document.getElementById('bottom-section').innerHTML = '';
  document.getElementById('table-content').innerHTML = html;
}

window.onload = loadDriveData;

/* ── 화면 갱신 ── */
function renderAll(){
  if(!curDate) return;
  document.getElementById('date-disp').textContent = curDate;
  const idx = sorted.indexOf(curDate);
  document.getElementById('prev-btn').disabled = (idx <= 0);
  document.getElementById('next-btn').disabled = (idx >= sorted.length-1);
  renderTopCharts(currentType);
  renderBottomChart(currentDev);
  renderTable(currentTableDev);
}

function changeDate(dir){
  const idx = sorted.indexOf(curDate), ni = idx + dir;
  if(ni >= 0 && ni < sorted.length){ curDate = sorted[ni]; renderAll(); }
}

// 현재 보기 범위의 날짜 목록 (일간: 1일, 3일간: 선택일 포함 최근 3개 파일)
function rangeDates(){
  if(viewMode === 'daily') return [curDate];
  const idx = sorted.indexOf(curDate);
  return sorted.slice(Math.max(0, idx-2), idx+1);
}

// 범위 안의 라벨과 특정 기기·항목의 값을 이어 붙임
function collect(dates, dev, field){
  const out = [];
  dates.forEach(d => out.push(...allData[d].chillers[dev][field]));
  return out;
}
function collectLabels(dates){
  const out = [];
  dates.forEach(d => allData[d].hours.forEach(h => out.push(viewMode==='daily' ? h : `${d.slice(5)} ${h}`)));
  return out;
}

function getChartOptions(unit = '°C'){
  return {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'nearest', intersect: true },
    scales: {
      y: {
        beginAtZero: true,
        ticks: { color: '#7aadcc' },
        grid: { color: 'rgba(26,58,92,0.3)' }
      },
      x: {
        ticks: {
          color: '#7aadcc', autoSkip: false, maxRotation: 0,
          callback: function(val, index){
            const label = this.getLabelForValue(val);
            if(viewMode === 'daily') return index % 3 === 0 ? label : '';
            return label.includes('00:00') ? label.replace(' 00:00','') : '';
          }
        },
        grid: {
          display: true, drawTicks: false,
          color: function(context){
            let label = '';
            if(context.tick && context.tick.value !== undefined) label = context.scale.getLabelForValue(context.tick.value);
            const gridColor = 'rgba(40, 90, 130, 0.4)';
            if(viewMode === 'daily'){
              if(label && label.includes('00:00')) return 'transparent';
              return context.index % 3 === 0 ? gridColor : 'transparent';
            }
            return (label && label.includes('00:00')) ? gridColor : 'transparent';
          },
          lineWidth: 1.5
        }
      }
    },
    plugins: {
      legend: { display: false },
      tooltip: {
        enabled: viewMode === 'daily',
        callbacks: {
          title: c => c[0].label,
          label: c => ' ' + c.dataset.label + ' : ' + (c.parsed.y !== null ? c.parsed.y : '--') + ' ' + unit
        }
      }
    }
  };
}

window.toggleTopDataset = function(g, el){
  const isHidden = el.style.opacity === '0.3';
  el.style.opacity = isHidden ? '1' : '0.3';
  if(charts.top){
    charts.top.getDatasetMeta(g*2).hidden = !isHidden;
    charts.top.getDatasetMeta(g*2+1).hidden = !isHidden;
    charts.top.update();
  }
};
window.toggleBottomDataset = function(g, el){
  const isHidden = el.style.opacity === '0.3';
  el.style.opacity = isHidden ? '1' : '0.3';
  if(charts.bottom){
    charts.bottom.getDatasetMeta(g*2).hidden = !isHidden;
    charts.bottom.getDatasetMeta(g*2+1).hidden = !isHidden;
    charts.bottom.update();
  }
};

/* ── 통합 비교 (4대 기기 한 번에) ── */
function renderTopCharts(type){
  currentType = type;
  if(!allData[curDate]) return;
  const T = TYPES[type];
  const dates = rangeDates();
  const labels = collectLabels(dates);
  const pr = viewMode==='daily' ? 1.0 : 0, pr2 = viewMode==='daily' ? 0.5 : 0;
  const datasets = [];
  DEVS.forEach((c, i) => {
    datasets.push({ label: c+' 공급', data: collect(dates, c, T.f[0]), borderColor: C4[i], borderWidth: 1.5, tension: 0.3, pointRadius: pr });
    datasets.push({ label: c+' 환수', data: collect(dates, c, T.f[1]), borderColor: C4_DARK[i], borderDash: [5,4], borderWidth: 1.0, tension: 0.3, pointRadius: pr2 });
  });
  document.getElementById('top-section').innerHTML = `
    <div class="cpanel">
      <div class="cpanel-hdr">
        <div class="cpanel-title" style="font-size:16px;">[${T.name}] 통합 비교 현황</div>
        <div class="tbl-ctrls">
          ${Object.keys(TYPES).map(k => `<button class="tbl-btn ${type===k?'active':''}" onclick="renderTopCharts('${k}')">${TYPES[k].name}</button>`).join('')}
        </div>
      </div>
      <div class="legend-bar" style="font-size:11px;">
        ${DEVS.map((c,i)=>`<div class="leg-item" onclick="window.toggleTopDataset(${i}, this)"><div class="leg-dot" style="background:${C4[i]}"></div><div class="leg-dot dark" style="background:${C4_DARK[i]}"></div>${c}</div>`).join('')}
      </div>
      <div class="cwrap"><canvas id="topChart"></canvas></div>
    </div>`;
  if(charts.top) charts.top.destroy();
  charts.top = new Chart(document.getElementById('topChart').getContext('2d'), { type:'line', data:{labels, datasets}, options:getChartOptions(T.unit) });
}

/* ── 기기별 세부 (중온수·난방·급탕 온도) ── */
const DETAIL = [
  { name:'중온수', f:['중온수공급','중온수환수'], c:['#ff7a4a','#a64d2e'] },
  { name:'난방',   f:['난방공급','난방환수'],     c:['#ffcc00','#997a00'] },
  { name:'급탕',   f:['급탕공급','급탕환수'],     c:['#00e5ff','#008291'] }
];

function renderBottomChart(dev){
  currentDev = dev;
  if(!allData[curDate]) return;
  const dates = rangeDates();
  const labels = collectLabels(dates);
  const pr = viewMode==='daily' ? 1.0 : 0, pr2 = viewMode==='daily' ? 0.5 : 0;
  const datasets = [];
  DETAIL.forEach(g => {
    datasets.push({ label: g.name+' 공급', data: collect(dates, dev, g.f[0]), borderColor: g.c[0], borderWidth: 1.5, tension: 0.3, pointRadius: pr });
    datasets.push({ label: g.name+' 환수', data: collect(dates, dev, g.f[1]), borderColor: g.c[1], borderDash: [5,4], borderWidth: 1.0, tension: 0.3, pointRadius: pr2 });
  });
  document.getElementById('bottom-section').innerHTML = `
    <div class="cpanel">
      <div class="cpanel-hdr">
        <div class="cpanel-title" style="font-size:16px;">기기별 세부 현황</div>
        <div class="tbl-ctrls">
          ${DEVS.map(c => `<button class="tbl-btn ${dev===c?'active':''}" onclick="renderBottomChart('${c}')">${c}</button>`).join('')}
        </div>
      </div>
      <div class="legend-bar" style="font-size:11px;">
        ${DETAIL.map((g,i)=>`<div class="leg-item" onclick="toggleBottomDataset(${i}, this)"><div class="leg-dot" style="background:${g.c[0]}"></div>${g.name}</div>`).join('')}
      </div>
      <div class="cwrap-full"><canvas id="bottomChart"></canvas></div>
    </div>`;
  if(charts.bottom) charts.bottom.destroy();
  charts.bottom = new Chart(document.getElementById('bottomChart').getContext('2d'), { type:'line', data:{labels, datasets}, options:getChartOptions('°C') });
}

/* ── 데이터표 ── */
function renderTable(dev = currentTableDev){
  currentTableDev = dev;
  if(!allData[curDate]) return;
  const d = allData[curDate];
  const val = v => (v === null || v === undefined) ? '--' : v.toFixed(1);
  const bd = 'border-right:1px solid rgba(26,58,92,0.8);';
  const bd2 = 'border-right:1px solid rgba(26,58,92,0.5);';
  const COLS = [
    { t:'중온수',   c:'#ff7a4a', c2:'#a64d2e', f:['중온수공급','중온수환수'] },
    { t:'난방',     c:'#ffcc00', c2:'#997a00', f:['난방공급','난방환수'] },
    { t:'급탕',     c:'#00e5ff', c2:'#008291', f:['급탕공급','급탕환수'] },
    { t:'난방압력', c:'#c792ff', c2:'#7a5aa6', f:['난방공급압력','난방환수압력'] }
  ];
  const ctrlsHtml = `
    <div class="cpanel-hdr">
      <div class="cpanel-title">기기별 데이터표 (${curDate})</div>
      <div class="tbl-ctrls">
        ${DEVS.map(c => `<button class="tbl-btn ${dev===c?'active':''}" onclick="renderTable('${c}')">${c}</button>`).join('')}
      </div>
    </div>`;
  let h = `<div class="tbl-wrap"><table><thead><tr>
      <th rowspan="2" style="${bd}vertical-align:middle;">시간</th>
      ${COLS.map((g,i) => `<th colspan="2" style="color:${g.c};${i<COLS.length-1?bd:''}">${g.t}</th>`).join('')}
    </tr><tr>
      ${COLS.map((g,i) => `<th style="color:${g.c};background:#0b1e38;font-size:10px;">공급</th><th style="color:${g.c2};background:#0b1e38;font-size:10px;${i<COLS.length-1?bd:''}">환수</th>`).join('')}
    </tr></thead><tbody>`;
  d.hours.forEach((hr, i) => {
    const ch = d.chillers[dev];
    h += `<tr><td style="${bd2}">${hr}</td>` +
      COLS.map((g,gi) => `<td style="color:${g.c};">${val(ch[g.f[0]][i])}</td><td style="color:${g.c2};${gi<COLS.length-1?bd2:''}">${val(ch[g.f[1]][i])}</td>`).join('') +
      `</tr>`;
  });
  h += `</tbody></table></div>`;
  document.getElementById('table-content').innerHTML = ctrlsHtml + h;
}

function switchTab(name, btn){
  document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
}
</script>
